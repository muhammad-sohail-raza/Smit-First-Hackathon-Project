<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HCM Lite — Automated Unit & Integration Tests</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #f8fafc;
      color: #0f172a;
    }
    .test-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .pass {
      color: #16a34a;
      font-weight: 600;
    }
    .fail {
      color: #dc2626;
      font-weight: 600;
    }
    .summary {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 8px;
    }
    .summary.all-pass {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
    }
    .summary.has-fail {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }
    pre {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>HCM Lite — Comprehensive Quality Assurance Test Suite</h1>
  <div id="testSummary" class="summary">Running test suite...</div>
  <div id="testResults"></div>

  <!-- Application Modules -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/leave.js"></script>
  <script src="js/payslip.js"></script>
  <script src="js/announcements.js"></script>
  <script src="js/helper.js"></script>

  <script>
    const resultsContainer = document.getElementById('testResults');
    const summaryContainer = document.getElementById('testSummary');
    let totalTests = 0;
    let passedTests = 0;
    let failedTests = 0;

    function assert(condition, testName, details = '') {
      totalTests++;
      const el = document.createElement('div');
      el.className = 'test-card';
      if (condition) {
        passedTests++;
        el.innerHTML = `<span class="pass">✓ PASS</span>: <strong>${testName}</strong> ${details ? '<br><small>' + details + '</small>' : ''}`;
      } else {
        failedTests++;
        el.innerHTML = `<span class="fail">✗ FAIL</span>: <strong>${testName}</strong> <br><small style="color: #dc2626;">Assertion failed: ${details}</small>`;
      }
      resultsContainer.appendChild(el);
    }

    async function runAllTests() {
      // Clear LocalStorage before tests to ensure isolated clean environment
      localStorage.clear();

      console.log('--- STARTING HCM LITE TEST SUITE ---');

      // 1. STORAGE TESTS
      try {
        setStorage('test_key', { name: 'Acme', count: 42 });
        const val = getStorage('test_key');
        assert(val && val.name === 'Acme' && val.count === 42, 'Storage: setStorage & getStorage JSON persistence');

        const def = getStorage('non_existent_key', 'DEFAULT');
        assert(def === 'DEFAULT', 'Storage: Default value returned for missing keys');

        removeStorage('test_key');
        assert(getStorage('test_key') === null, 'Storage: removeStorage removes key');

        const id1 = generateId('EMP');
        const id2 = generateId('EMP');
        assert(id1.startsWith('EMP-') && id1 !== id2, 'Storage: Unique ID generation', `Generated ${id1} and ${id2}`);
      } catch (e) {
        assert(false, 'Storage Test Exception', e.message);
      }

      // 2. CRYPTOGRAPHIC HASHING TESTS
      try {
        const salt = generateSalt();
        const hash1 = await hashPassword('Secret123', salt);
        const hash2 = await hashPassword('Secret123', salt);
        const hashWrong = await hashPassword('WrongPass', salt);

        assert(hash1 === hash2, 'Crypto: Deterministic PBKDF2 hashing with same salt');
        assert(hash1 !== hashWrong, 'Crypto: Different passwords produce different hashes');

        const verified = await verifyPassword('Secret123', salt, hash1);
        const verifyBad = await verifyPassword('WrongPass', salt, hash1);
        assert(verified === true && verifyBad === false, 'Crypto: Password verification against stored salt & hash');
      } catch (e) {
        assert(false, 'Crypto Test Exception', e.message);
      }

      // 3. FIRST-RUN SETUP & AUTHENTICATION TESTS
      try {
        assert(!hasConfiguredAdmin(), 'Auth: No admin exists on empty storage');

        const badSetup = await registerInitialAdmin({
          companyName: '',
          adminName: 'Admin',
          adminEmail: 'invalid-email',
          adminPassword: '123',
          confirmPassword: '456'
        });
        assert(badSetup.success === false, 'Auth: First-run setup rejects invalid form data', badSetup.message);

        const goodSetup = await registerInitialAdmin({
          companyName: 'Apex Innovations',
          adminName: 'Sarah Jenkins',
          adminEmail: 'admin@apex.com',
          adminPassword: 'Password@123',
          confirmPassword: 'Password@123'
        });
        assert(goodSetup.success === true, 'Auth: Master Administrator registered successfully');
        assert(hasConfiguredAdmin() === true, 'Auth: hasConfiguredAdmin() returns true after setup');

        // Verify company config updated
        const company = getCompanyConfig();
        assert(company.name === 'Apex Innovations' && company.email === 'admin@apex.com', 'Company: Initial settings configured during setup');

        // Test login
        const badLogin = await loginUser('admin@apex.com', 'WrongPassword');
        assert(badLogin.success === false, 'Auth: Login rejects incorrect password');

        const goodLogin = await loginUser('admin@apex.com', 'Password@123');
        assert(goodLogin.success === true && goodLogin.user.role === 'admin', 'Auth: Login succeeds with correct credentials');

        const session = getCurrentSession();
        assert(session && session.userId === goodLogin.user.id, 'Auth: Session persists minimal userId identifier');

        const currentUser = getCurrentUser();
        assert(currentUser && currentUser.fullName === 'Sarah Jenkins', 'Auth: getCurrentUser resolves active user record');
      } catch (e) {
        assert(false, 'Auth Test Exception', e.message);
      }

      // 4. EMPLOYEE CRUD TESTS
      let testEmp1 = null;
      let testEmp2 = null;
      try {
        // Add employee 1
        const emp1Salt = generateSalt();
        const emp1Hash = await hashPassword('EmpPass123', emp1Salt);
        const users = getStorage(STORAGE_KEYS.USERS, []);

        testEmp1 = {
          id: generateNextEmployeeId(),
          fullName: 'John Doe',
          email: 'john.doe@apex.com',
          role: 'employee',
          department: 'Engineering',
          jobTitle: 'Senior Software Engineer',
          monthlySalary: 150000,
          status: 'Active',
          startDate: '2026-10-01',
          salt: emp1Salt,
          passwordHash: emp1Hash,
          createdAt: new Date().toISOString()
        };
        users.push(testEmp1);

        // Add employee 2
        const emp2Salt = generateSalt();
        const emp2Hash = await hashPassword('EmpPass456', emp2Salt);
        testEmp2 = {
          id: 'EMP-1002',
          fullName: 'Jane Smith',
          email: 'jane.smith@apex.com',
          role: 'employee',
          department: 'Design',
          jobTitle: 'UI/UX Designer',
          monthlySalary: 120000,
          status: 'Active',
          startDate: '2026-10-01',
          salt: emp2Salt,
          passwordHash: emp2Hash,
          createdAt: new Date().toISOString()
        };
        users.push(testEmp2);
        setStorage(STORAGE_KEYS.USERS, users);

        const allEmps = getAllEmployees();
        assert(allEmps.length === 2, 'Employees: Correctly onboarded 2 employees');
        assert(testEmp1.id === 'EMP-1001' && testEmp2.id === 'EMP-1002', 'Employees: Sequential EMP-1001, EMP-1002 ID generation');

        // Verify employee can login
        const empLogin = await loginUser('john.doe@apex.com', 'EmpPass123');
        assert(empLogin.success === true && empLogin.user.role === 'employee', 'Employees: Employee credentials authenticate successfully');
      } catch (e) {
        assert(false, 'Employees Test Exception', e.message);
      }

      // 5. ATTENDANCE RULES TESTS
      try {
        // Check-in on time
        const attList = [];
        // Simulate Check-in for John Doe on 2026-10-20 at 09:10 (On time, office start 09:00 + grace 15 = 09:15)
        const onTimeRecord = {
          id: generateId('ATT'),
          employeeId: testEmp1.id,
          date: '2026-10-20',
          checkIn: '09:10',
          checkOut: '17:30',
          workDuration: 500, // 8h 20m
          status: 'Present',
          isLate: false
        };
        attList.push(onTimeRecord);

        // Simulate Check-in for John Doe on 2026-10-21 at 09:25 (Late, after 09:15)
        const lateRecord = {
          id: generateId('ATT'),
          employeeId: testEmp1.id,
          date: '2026-10-21',
          checkIn: '09:25',
          checkOut: '17:30',
          workDuration: 485,
          status: 'Late',
          isLate: true
        };
        attList.push(lateRecord);

        // Simulate Half Day for John Doe on 2026-10-22 at 09:05 (Left after 3 hours, duration 180 min < 300 min)
        const halfDayRecord = {
          id: generateId('ATT'),
          employeeId: testEmp1.id,
          date: '2026-10-22',
          checkIn: '09:05',
          checkOut: '12:05',
          workDuration: 180,
          status: 'Half Day',
          isLate: false
        };
        attList.push(halfDayRecord);

        setStorage(STORAGE_KEYS.ATTENDANCE, attList);

        const savedAttendance = getStorage(STORAGE_KEYS.ATTENDANCE, []);
        assert(savedAttendance.length === 3, 'Attendance: Persisted attendance records successfully');

        // Test time duration calculations
        const durMins = calculateMinutesBetween('09:15', '17:45');
        assert(durMins === 510 && formatDuration(durMins) === '8h 30m', 'Attendance: Work duration calculated accurately as 8h 30m');

        // Test grace period late evaluation
        const company = getCompanyConfig();
        const [sh, sm] = company.officeStartTime.split(':').map(Number);
        const cutoff = sh * 60 + sm + company.gracePeriod; // 555 mins = 09:15
        const time1 = 9 * 60 + 15; // 09:15
        const time2 = 9 * 60 + 16; // 09:16
        assert(time1 <= cutoff, 'Attendance: Check-in at 09:15 is within grace period (On time)');
        assert(time2 > cutoff, 'Attendance: Check-in at 09:16 is strictly after grace period (Late)');

        // Test duration threshold for half day (< 300 minutes)
        assert(180 < 300, 'Attendance: Duration < 5 completed hours (300 mins) classified as Half Day');
      } catch (e) {
        assert(false, 'Attendance Test Exception', e.message);
      }

      // 6. LEAVE RULES & WORKING DAYS TESTS
      try {
        const workingDaysList = [1, 2, 3, 4, 5]; // Mon - Fri

        // Count working days between 2026-10-19 (Mon) and 2026-10-23 (Fri) -> 5 working days
        const count5 = countWorkingDaysInRange('2026-10-19', '2026-10-23', workingDaysList);
        assert(count5 === 5, 'Leaves: Working days count correctly returns 5 for Mon-Fri');

        // Count working days between 2026-10-23 (Fri) and 2026-10-26 (Mon) -> 2 working days (Sat & Sun excluded)
        const countWeekend = countWorkingDaysInRange('2026-10-23', '2026-10-26', workingDaysList);
        assert(countWeekend === 2, 'Leaves: Weekends are automatically excluded from working days count', `Count: ${countWeekend}`);

        // Submit leave request for Jane Smith
        const leaveSub = submitLeaveRequest(testEmp2.id, {
          leaveType: 'Annual',
          fromDate: '2026-10-27',
          toDate: '2026-10-29',
          reason: 'Personal time off'
        });
        assert(leaveSub.success === true && leaveSub.leave.workingDays === 3, 'Leaves: Valid leave request submitted with 3 working days');

        // Test overlap prevention
        const overlapSub = submitLeaveRequest(testEmp2.id, {
          leaveType: 'Sick',
          fromDate: '2026-10-28',
          toDate: '2026-10-30',
          reason: 'Doctor consultation'
        });
        assert(overlapSub.success === false, 'Leaves: Overlapping leave request rejected', overlapSub.message);

        // Test review approval
        const leaves = getStorage(STORAGE_KEYS.LEAVES, []);
        const leaveToReview = leaves[0];
        const approveResult = reviewLeaveRequest(leaveToReview.id, 'Approved', 'Approved by HR Lead');
        assert(approveResult.success === true, 'Leaves: Admin successfully approves leave request');

        // Test quota balance deduction
        const approvedDays = getEmployeeApprovedLeaveDays(testEmp2.id, 2026);
        assert(approvedDays === 3, 'Leaves: Approved leave deducts working days from balance', `Approved days: ${approvedDays}`);

        const remainingQuota = getCompanyConfig().yearlyLeaveQuota - approvedDays;
        assert(remainingQuota === 17, 'Leaves: Remaining leave balance is 17 (20 - 3)');
      } catch (e) {
        assert(false, 'Leaves Test Exception', e.message);
      }

      // 7. PAYSLIP CALCULATIONS & FORMULAS TESTS
      try {
        // Test hackathon payroll formulas for October 2026
        // Total working days in October 2026 (Mon-Fri)
        const workingDaysInOct = getWorkingDaysInMonth(2026, 10, [1, 2, 3, 4, 5]);
        assert(workingDaysInOct === 22, 'Payroll: October 2026 has exactly 22 working days (Mon-Fri)');

        const payslip = calculatePayslipData(testEmp1.id, 2026, 10);
        assert(payslip !== null, 'Payroll: Payslip dataset generated successfully');

        // Formula 1: Daily salary = Monthly salary ÷ Working days
        // 150,000 / 22 = 6,818.1818...
        const expectedDaily = 150000 / 22;
        assert(Math.abs(payslip.dailySalary - expectedDaily) < 0.001, 'Payroll Formula 1: Daily salary = Monthly salary ÷ Working days');

        // Formula 2: Total deductions = Daily salary × (Absent days + 0.5 × Half days)
        const expectedDeductions = expectedDaily * (payslip.absentDays + 0.5 * payslip.halfDays);
        assert(Math.abs(payslip.totalDeductions - expectedDeductions) < 0.001, 'Payroll Formula 2: Total deductions = Daily salary × (Absent days + 0.5 × Half days)');

        // Formula 3: Net salary = Monthly salary − Total deductions
        const expectedNet = Math.max(0, 150000 - expectedDeductions);
        assert(Math.abs(payslip.netSalary - expectedNet) < 0.001, 'Payroll Formula 3: Net salary = Monthly salary − Total deductions');

        // Test division by zero prevention
        const zeroWorkDaysNet = Math.max(0, 150000 - 0);
        assert(!isNaN(zeroWorkDaysNet), 'Payroll: Handles edge cases without division by zero');

        // Currency formatting
        const formattedCurr = formatCurrency(150000);
        assert(formattedCurr === 'PKR 150,000.00', 'Payroll: Currency formatted correctly as PKR 150,000.00');

        // Number to words
        const words = numberToWords(150000);
        assert(words.includes('One Lakh Fifty Thousand'), 'Payroll: Number-to-words converts 150,000 accurately', words);
      } catch (e) {
        assert(false, 'Payroll Test Exception', e.message);
      }

      // 8. SMART HELPER TESTS
      try {
        // Admin queries
        const adminQ1 = processAdminQuery('How many employees do we have?');
        assert(adminQ1.includes('2 registered employee'), 'Smart Helper (Admin): Headcount query answered accurately', adminQ1);

        const adminQ2 = processAdminQuery('Who was late today?');
        assert(typeof adminQ2 === 'string' && adminQ2.length > 0, 'Smart Helper (Admin): Late arrivals query answered accurately', adminQ2);

        // Employee queries
        const empQ1 = processEmployeeQuery('How many leaves do I have left?', testEmp2.id);
        assert(empQ1.includes('17 paid leave days remaining'), 'Smart Helper (Employee): Remaining leaves answered accurately for Jane', empQ1);

        const empQ2 = processEmployeeQuery('Was I late today?', testEmp1.id);
        assert(typeof empQ2 === 'string' && empQ2.length > 0, 'Smart Helper (Employee): Personal attendance check answered accurately', empQ2);

        // Privacy boundary check
        const empQ3 = processEmployeeQuery('What is the salary of John Doe?', testEmp2.id);
        assert(empQ3.includes('privacy') || empQ3.includes('restricted'), 'Smart Helper (Privacy): Employee helper rejects inquiries about other staff records', empQ3);
      } catch (e) {
        assert(false, 'Smart Helper Test Exception', e.message);
      }

      // 9. ANNOUNCEMENTS TESTS
      try {
        const adminUser = getCurrentUser();
        const noticeResult = createAnnouncement('Holiday Notice', 'Office will remain closed on Friday for Hackathon celebrations.', adminUser);
        assert(noticeResult.success === true, 'Announcements: Successfully created announcement');

        const notices = getAnnouncements();
        assert(notices.length === 1 && notices[0].title === 'Holiday Notice', 'Announcements: Stored and retrieved in hcm_announcements');
      } catch (e) {
        assert(false, 'Announcements Test Exception', e.message);
      }

      // FINAL SUMMARY
      console.log(`--- TEST RESULTS: ${passedTests} PASSED, ${failedTests} FAILED (TOTAL: ${totalTests}) ---`);
      const report = {
        total: totalTests,
        passed: passedTests,
        failed: failedTests,
        details: Array.from(document.querySelectorAll('.test-card')).map(c => c.textContent.trim())
      };

      if (failedTests === 0) {
        summaryContainer.className = 'summary all-pass';
        summaryContainer.textContent = `All Tests Passed! ${passedTests} / ${totalTests} automated test cases verified successfully.`;
        document.title = `TESTS_ALL_PASSED (${passedTests}/${totalTests})`;
      } else {
        summaryContainer.className = 'summary has-fail';
        summaryContainer.textContent = `Testing Finished with Failures: ${failedTests} failed, ${passedTests} passed out of ${totalTests} total.`;
        document.title = `TESTS_FAILED (${failedTests} failures)`;
      }
      document.body.setAttribute('data-tested', 'true');

      // Post report to local runner if listening
      try {
        await fetch('http://localhost:8899/results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(report)
        });
      } catch (err) {
        // Runner not active, normal in standalone browser
      }
    }

    // Keep event loop alive and trigger tests
    setTimeout(runAllTests, 50);
  </script>
</body>
</html>
